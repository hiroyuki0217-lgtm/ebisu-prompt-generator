    ja: `次の条件で画像を1枚作成してください。${story.anchorJa}。恵比寿を中心とする共有された公共空間で、十分な自然な距離から撮ったフォトリアルな日常のスマホ写真。日時・天気・季節の服装: ${story.promptJa}。${storyWorld.ja}。${faceJa}。${profile.ja}。職業に合う髪型・メイク・小物: ${profile.groomJa}。服装系統: ${fashion.ja}。${ebisuStyle.ja}。${demeanorJa}。${upperBodyFocus.ja}。${capture.ja}。${backgroundCrowd.ja}。${phoneRealism.ja}。${copyrightMark.ja}。\n\nネガティブプロンプト: ${negativePrompt.ja}`,
    en: `Create one image using this exact specification. ${story.anchorEn}. Photorealistic everyday phone photo taken from a respectful ordinary public distance in a shared public setting centered on Ebisu. Time, place, weather, and seasonal clothing: ${story.promptEn}. ${storyWorld.en}. ${faceEn}. ${profile.en}. Role-appropriate hair, makeup, and accessories: ${profile.groomEn}. Fashion direction: ${fashion.en}. ${ebisuStyle.en}. ${demeanorEn}. ${upperBodyFocus.en}. ${capture.en}. ${backgroundCrowd.en}. ${phoneRealism.en}. ${copyrightMark.en}.\n\nNegative prompt: ${negativePrompt.en}`,
    postJa,
    storyAction: story.postActionJa,
    storyActionEn: story.actionEn,
    storyAnchorEn: story.anchorEn,
    occupation: profile.ja,
    occupationEn: profile.en,
    temporalContext: story.promptJa,
    storyMood: `${story.lightJa}、${story.postJa.split('。')[1]}`,
    temporalPeriod: story.period,
    allowedPeriods: [story.period],
    faceProfileId: faceProfile.id
  };
}
function copyText(text, button) {
  const done = () => { const label = button.textContent; button.textContent = 'コピーしました'; setTimeout(() => button.textContent = label, 1400); };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const area = document.createElement('textarea');
  area.value = text;
  area.setAttribute('readonly', '');
  area.style.cssText = 'position:fixed;opacity:0;pointer-events:none;';
  document.body.append(area);
  area.select();
  try { document.execCommand('copy'); done(); } finally { area.remove(); }
}
async function shareApp(button) {
  const shareData = { title: document.title, text: '街で見かけた架空の彼女の画像が作れます。', url: location.href };
  try {
    if (navigator.share) await navigator.share(shareData);
    else copyText(location.href, button);
  } catch (error) {
    if (error.name !== 'AbortError') copyText(location.href, button);
  }
}
async function sharePost(button) {
  copyText(currentPrompt.postJa, button);
}
const favoritesKey = 'ebisu-prompt-generator-favorites';
function saveFavorite(button) {
  try {
    const favorites = JSON.parse(localStorage.getItem(favoritesKey) || '[]');
    favorites.unshift({ id: `${Date.now()}-${Math.random().toString(16).slice(2)}`, date: new Intl.DateTimeFormat('ja-JP', { month:'long', day:'numeric' }).format(new Date()), text: currentPrompt.postJa, prompt: currentPrompt.en });
    localStorage.setItem(favoritesKey, JSON.stringify(favorites));
    const label = button.textContent; button.textContent = 'お気に入りに追加しました'; setTimeout(() => button.textContent = label, 1400);
  } catch (error) {
    button.textContent = '保存できませんでした'; setTimeout(() => button.textContent = 'お気に入りに追加', 1400);
  }
}
let currentPrompt;
function generate() {
  const out = document.querySelector('#results');
  currentPrompt = makePrompt();
  out.innerHTML = `<article><h2>今日こんな彼女を見かけた</h2><p class="post-summary"><strong>${currentPrompt.postJa}</strong></p><div class="action-row"><button class="secondary copy-one">プロンプトコピー</button><button class="secondary" id="reroll">別の日</button></div><button class="favorite-button" id="favorite">お気に入りに追加</button><p class="meta">コピー後、ChatGPTまたはGeminiに貼り付けて送信してください。</p></article>`;
  document.querySelector('.copy-one').addEventListener('click', button => copyText(currentPrompt.en, button.currentTarget));
  document.querySelector('#reroll').addEventListener('click', generate);
  document.querySelector('#favorite').addEventListener('click', button => saveFavorite(button.currentTarget));
}
document.querySelector('#share-app').addEventListener('click', button => shareApp(button.currentTarget));
document.querySelector('#share-post').addEventListener('click', button => sharePost(button.currentTarget));
generate();
</script>
