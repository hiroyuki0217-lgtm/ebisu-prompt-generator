function copyText(text, button) {
  const done = () => { const label = button.textContent; button.textContent = 'コピーしました'; setTimeout(() => button.textContent = label, 1400); };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const area = document.createElement('textarea');
  area.value = text;
  area.setAttribute('readonly', '');
  area.style.cssText = 'position:fixed;opacity:0;pointer-events:none;';
  document.body.append(area);
  area.select();
  try { document.execCommand('copy'); done(); } finally { area.remove(); }
}
async function sharePage() {
  const button = document.querySelector('#share-page');
  if (location.protocol === 'file:') {
    alert('このパソコン上のファイルは、そのままiPhoneへ共有できません。Google DriveでこのHTMLの共有リンクを作成してから、iPhoneのSafariでそのリンクを開いてください。');
    return;
  }
  const shareData = { title: document.title, text: '今日恵比寿ですれ違った素敵な女性｜画像プロンプトメーカー', url: location.href };
  try {
    if (navigator.share) await navigator.share(shareData);
    else copyText(location.href, button);
  } catch (error) {
    if (error.name !== 'AbortError') copyText(location.href, button);
  }
}

  document.querySelectorAll('.copy-one').forEach(button => button.addEventListener('click', () => copyText(currentPrompt[button.dataset.lang], button)));
}
